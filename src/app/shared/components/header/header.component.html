<div class="flex flex-col md:flex-row items-center justify-between gap-6">
  <div class="capitalize">
    <button (click)="toggleSidebar.emit()"
      class="flex items-center gap-2 text-blue-gray-900 text-sm font-semibold hover:text-blue-500 focus:outline-none">
      <!-- Ícono de menú -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span>Menu</span>
    </button>
    <!-- Título -->
   <nav class="mt-1 text-sm text-gray-600 
            overflow-hidden whitespace-nowrap text-ellipsis truncate
            max-w-full">
  Repositorio de Documentos /
   <span class="font-medium">{{ facultadName }}</span> /
  <span class="font-medium">{{ departamentoName }}</span> 
 
</nav>

  </div>

  <div class="flex items-center gap-4">
  

    <!-- Botón de Perfil -->
    <button routerLink="/perfil"
      class="w-10 h-10 rounded-full overflow-hidden border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <img src="https://cdn.pixabay.com/photo/2021/07/02/04/48/user-6380868_640.png" alt="Perfil">
    </button>

    <!-- Botón de Cerrar Sesión -->
    <button (click)="cerrarSesion()"
      class="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5a2 2 0 00-2-2h-3.5a2 2 0 00-2 2v14a2 2 0 002 2H11a2 2 0 002-2v-1" />
      </svg>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</div>
