<div class="my-5">
  <div class="container mx-auto max-w-xs sm:max-w-md md:max-w-lg lg:max-w-xl shadow-md dark:shadow-white py-4 px-6 sm:px-10 bg-blue-500 border-yellow-500 rounded-md">
    
    <!-- Botón Volver -->
    <button (click)="volver()" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-md text-white text-sm sm:text-lg shadow-md">
      Volver
    </button>
    
    <div class="my-3">
      <h1 class="text-center text-2xl sm:text-3xl font-bold text-white">Registrar Versión</h1>
      
      <form [formGroup]="formRegistro" (ngSubmit)="registrarVersion()" class="mt-4">

        <!-- Campo Usuario -->
        <div class="mb-4">
          <label for="ID_USUARIO" class="block text-sm sm:text-md font-bold text-yellow-300 mb-1">
            Usuario Responsable *
          </label>
          <select id="ID_USUARIO" formControlName="ID_USUARIO"
                  class="w-full px-3 py-2 border border-yellow-500 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-500 bg-white text-gray-900">
            <option value="">-- Seleccione un usuario --</option>
            <option *ngFor="let usuario of listUsuarios" [value]="usuario.ID_USUARIO">
              {{ usuario.NOMBRE_USUARIO }}
            </option>
          </select>
          <div *ngIf="formRegistro.get('ID_USUARIO')?.invalid && (formRegistro.get('ID_USUARIO')?.touched || formRegistro.get('ID_USUARIO')?.dirty)"
               class="mt-1 text-red-500 text-xs sm:text-sm">
            Por favor seleccione un usuario
          </div>
        </div>

        <!-- Campo Nombre -->
        <div class="mb-4">
          <label for="nombre" class="block text-sm sm:text-md font-bold text-yellow-300 mb-1">
            Nombre de la Versión *
          </label>
          <input type="text" id="nombre" formControlName="nombre"
                 class="w-full px-3 py-2 border border-yellow-500 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-500 bg-white text-gray-900"
                 placeholder="Ej: Versión 1.0.0">
          <div *ngIf="formRegistro.get('nombre')?.invalid && (formRegistro.get('nombre')?.touched || formRegistro.get('nombre')?.dirty)"
               class="mt-1 text-red-500 text-xs sm:text-sm">
            Por favor ingrese un nombre para la versión
          </div>
        </div>

        <!-- Checkbox Cambios -->
        <div class="mb-6 flex items-center">
          <input type="checkbox" id="cambios" formControlName="cambios"
                 class="h-4 w-4 text-yellow-600 focus:ring-yellow-500 border-yellow-500 rounded">
          <label for="cambios" class="ml-2 text-sm sm:text-md font-bold text-yellow-300">
            ¿Esta versión incluye cambios significativos?
          </label>
        </div>

        <!-- Botón Guardar -->
        <div class="flex justify-center">
          <button type="submit" [disabled]="formRegistro.invalid"
                  class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-md shadow-lg transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed">
            Registrar Versión
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
