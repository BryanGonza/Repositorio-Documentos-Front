<div class="p-4 max-w-6xl mx-auto bg-white shadow-md rounded"> 
  <!-- 📌 Título con botones de acción -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold text-gray-900">REPORTE DE DOCUMENTOS</h2>

    <!-- Botones de acción -->
    <div class="flex gap-2">
      <!-- Botón: Descargar PDF -->
      <button (click)="descargarPDF()" class="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded shadow"
        title="Descargar PDF">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4v12m0 0l-3-3m3 3l3-3m-9 7h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
      </button>

      <!-- Botón: Ver lista completa -->
      <button (click)="verListaCompleta()" class="bg-green-500 hover:bg-green-600 text-white p-2 rounded shadow"
        title="Ver lista completa">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 🔍 Filtros -->
  <div class="flex flex-wrap gap-3 justify-center mb-4">
    <input type="text" [(ngModel)]="usuario" placeholder="BUSCAR POR USUARIO"
      class="w-60 p-2 pl-3 border border-yellow-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <input type="text" [(ngModel)]="nombreDocumento" placeholder="BUSCAR POR DOCUMENTO"
      class="w-60 p-2 pl-3 border border-yellow-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <input type="date" [(ngModel)]="fechaInicio"
      class="w-40 p-2 border border-yellow-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <input type="date" [(ngModel)]="fechaFin"
      class="w-40 p-2 border border-yellow-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <button (click)="obtenerReporte()"
      class="bg-blue-600 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded shadow">
      FILTRAR
    </button>
  </div>

  <!-- 📋 Tabla del Reporte -->
  <table class="w-full table-auto border border-yellow-500 font-sans text-sm">
    <thead class="bg-blue-600 text-white">
      <tr>
        <th class="py-2 px-4 border border-yellow-500">ID</th>
        <th class="py-2 px-4 border border-yellow-500">DOCUMENTO</th>
        <th class="py-2 px-4 border border-yellow-500">USUARIO</th>
        <th class="py-2 px-4 border border-yellow-500">ACCIÓN</th>
        <th class="py-2 px-4 border border-yellow-500">FECHA</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of getPaginatedData(); let i = index"
        [ngClass]="{ 'bg-yellow-100': i % 2 === 0, 'bg-white': i % 2 !== 0 }">
        <td class="py-2 px-4 border border-yellow-500">{{ item.ID_BITACORA }}</td>
        <td class="py-2 px-4 border border-yellow-500">{{ item.NOMBRE_DOCUMENTO || 'Sin Nombre' }}</td>
        <td class="py-2 px-4 border border-yellow-500">{{ item.USUARIO_ACCION }}</td>
        <td class="py-2 px-4 border border-yellow-500">{{ item.ACCION }}</td>
        <td class="py-2 px-4 border border-yellow-500">{{ item.FECHA_CREACION | date:'dd/MM/yyyy HH:mm' }}</td>
      </tr>
      <tr *ngIf="listaFiltrada.length === 0">
        <td colspan="5" class="py-4 text-center text-gray-500">No se encontraron resultados.</td>
      </tr>
    </tbody>
  </table>

  <!-- 📌 Paginación -->
  <div class="flex justify-center items-center mt-6 gap-2">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
      class="px-3 py-1 rounded font-semibold text-white bg-blue-600 hover:bg-yellow-500 disabled:bg-blue-300">
      Anterior
    </button>

    <span class="px-3 py-1 rounded font-semibold text-white bg-blue-600">
      Página {{ currentPage }} de {{ totalPages }}
    </span>

    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages"
      class="px-3 py-1 rounded font-semibold text-white bg-blue-600 hover:bg-yellow-500 disabled:bg-blue-300">
      Siguiente
    </button>
  </div>
</div>
