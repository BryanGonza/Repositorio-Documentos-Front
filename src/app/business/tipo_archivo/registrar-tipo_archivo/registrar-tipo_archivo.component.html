<div class="my-5">
  <!-- Contenedor principal con fondo azul -->
  <div
    class="container mx-auto max-w-xs sm:max-w-md md:max-w-lg lg:max-w-xl shadow-md dark:shadow-white py-4 px-6 sm:px-10 bg-blue-500 border-yellow-500 rounded-md">

    <!-- Botón Volver -->
    <button (click)="volver()"
      class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-md text-white text-sm sm:text-lg shadow-md">
      Volver
    </button>

    <div class="my-3">
      <!-- Título del formulario -->
      <h1 class="text-center text-2xl sm:text-3xl font-bold text-white">Registrar Tipo de Archivo</h1>
      <form [formGroup]="formRegistro" (ngSubmit)="registrarTipo_archivo()">

        <!-- Campo para Nombre de la id_tipo_archivo
          <div class="my-2">
            <label for="IDTipo_archivo" class="text-sm sm:text-md font-bold text-yellow-300">ID TIPO DE ARCHIVO</label>
            <input type="text" id="IDTipo_archivo" formControlName="IDTipo_archivo" 
                   class="block w-full border border-yellow-500 outline-yellow-800 px-2 py-2 text-sm sm:text-md rounded-md my-2 bg-white text-gray-900" 
                   placeholder="Ingrese el id tipo de archivo">
          </div>-->

        <!-- Campo para Nombre de la tipo_archivo -->
        <div class="my-2">
          <label for="Tipo" class="text-sm sm:text-md font-bold text-yellow-300">TIPO DE ARCHIVO</label>
          <input list="tiposArchivos" id="Tipo" formControlName="Tipo"
            class="block w-full border border-yellow-500 outline-yellow-800 px-2 py-2 text-sm sm:text-md rounded-md my-2 bg-white text-gray-900"
            placeholder="Buscar o seleccionar tipo de archivo">

          <datalist id="tiposArchivos">
            <!-- Documentos -->
            <option value="PDF">
            <option value="DOC">
            <option value="DOCX">
            <option value="XLS">
            <option value="XLSX">
            <option value="PPT">
            <option value="PPTX">
            <option value="TXT">
            <option value="RTF">
            <option value="CSV">
            <option value="ODS">
            <option value="ODT">
            <option value="MD">

              <!-- Imágenes -->
            <option value="JPG">
            <option value="JPEG">
            <option value="PNG">
            <option value="GIF">
            <option value="BMP">
            <option value="SVG">
            <option value="WEBP">
            <option value="TIFF">

              <!-- Comprimidos -->
            <option value="ZIP">
            <option value="RAR">
            <option value="7Z">
            <option value="TAR">
            <option value="GZ">

              <!-- Audio -->
            <option value="MP3">
            <option value="WAV">
            <option value="OGG">
            <option value="AAC">
            <option value="FLAC">

              <!-- Video -->
            <option value="MP4">
            <option value="MKV">
            <option value="AVI">
            <option value="MOV">
            <option value="WMV">
            <option value="FLV">

              <!-- Código -->
            <option value="HTML">
            <option value="CSS">
            <option value="JS">
            <option value="TS">
            <option value="JSON">
            <option value="XML">
            <option value="YAML">
            <option value="JAVA">
            <option value="PY">
            <option value="PHP">
            <option value="CS">
            <option value="C">
            <option value="CPP">
            <option value="RB">
            <option value="GO">
            <option value="SQL">

              <!-- Otros -->
            <option value="ISO">
            <option value="EXE">
            <option value="APK">
            <option value="BAT">
            <option value="DLL">
          </datalist>

        </div>

        <!-- Campo para limite de almacenamiento -->
        <div class="my-2">
          <label for="Limite" class="text-sm sm:text-md font-bold text-yellow-300">LIMITE DE ALMACENAMIENTO</label>
          <input type="text" id="Limite" formControlName="Limite"
            class="block w-full border border-yellow-500 outline-yellow-800 px-2 py-2 text-sm sm:text-md rounded-md my-2 bg-white text-gray-900"
            placeholder="Ingrese el tipo de archivo">
        </div>


        <!-- Botón Guardar -->
        <button type="submit" [disabled]="formRegistro.invalid"
          class="px-4 py-1 bg-emerald-500 hover:bg-emerald-600 rounded-md text-black text-sm sm:text-lg shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed">
          Guardar
        </button>

      </form>
    </div>
  </div>
</div>
